  #     - .env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - mongodb
  #     - neo4j
  #     - minio
  #     - ollama
  #     - jaeger

  mongodb:
    image: mongo:8.2
    ports:
      - "27017:27017"

  neo4j:
    image: neo4j:5.26.0
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
    ports:
      - "7474:7474"
      - "7687:7687"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"


