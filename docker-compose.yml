services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - neo4j
      - minio
      - ollama
      - jaeger

  api-real:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.real
    ports:
      - "8000:8000"
    profiles:
      - real
    depends_on:
      - mongodb
      - neo4j
      - minio
      - ollama
      - tts-api
      - jaeger

  mongodb:
    image: mongo:8.2
    ports:
      - "27017:27017"

  neo4j:
    image: neo4j:6
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
    ports:
      - "7474:7474"
      - "7687:7687"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  tts-api:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ../llm-tts-api:/app
    command: >
      sh -lc "pip install --no-cache-dir -e . &&
      uvicorn llm_tts_api.main:app --host 0.0.0.0 --port 8010"
    profiles:
      - real
    ports:
      - "8010:8010"



